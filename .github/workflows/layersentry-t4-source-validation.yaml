---
name: LayerSentry T4 Source Validation

on:
  pull_request:
    paths:
      - "cmd/opennebula-csi/**"
      - "pkg/csi/**"
      - "helm/opennebula-csi/**"
      - "packaging/layersentry/**"
      - ".github/workflows/layersentry-t4-source-validation.yaml"
      - ".github/workflows/layersentry-production-gate.yaml"
      - ".github/workflows/release-csi.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Go test upstream-compatible profile
        run: go test ./...

      - name: LayerSentry tagged build and focused profile tests
        run: |
          go build -trimpath -tags layersentry ./cmd/opennebula-csi
          go test -tags layersentry ./cmd/opennebula-csi
          go test -tags layersentry ./pkg/csi/driver \
            -run '^(TestLayerSentry|TestAttachmentReconciler)'

      - name: Packaging and promotion-gate unit tests
        working-directory: packaging/layersentry
        run: |
          python3 -m unittest discover -p 'test_*.py' -v
          bash -n build_release.sh
          python3 -m py_compile \
            build_chart.py \
            emit_offline_manifest.py \
            validate_qualification.py \
            validate_storage_profile.py \
            validate_live_evidence.py \
            verify_oci_attestations.py \
            verify_live_release.py \
            record_controlled_evidence.py \
            live_qualification.py

      - name: Current incomplete qualification must remain blocked
        run: |
          set +e
          python3 packaging/layersentry/validate_qualification.py \
            --matrix packaging/layersentry/qualification-matrix.json \
            --release-lock packaging/layersentry/release-lock.template.json \
            --evidence-root . > "${RUNNER_TEMP}/qualification-gate.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Fq 'NOT_QUALIFIED' "${RUNNER_TEMP}/qualification-gate.out"
          grep -Fq 'selected_storage_profile' "${RUNNER_TEMP}/qualification-gate.out"

          set +e
          python3 packaging/layersentry/validate_storage_profile.py \
            --matrix packaging/layersentry/qualification-matrix.json \
            --release-lock packaging/layersentry/release-lock.template.json \
            --evidence-root . > "${RUNNER_TEMP}/storage-profile-gate.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Fq 'STORAGE_PROFILE_NOT_QUALIFIED' "${RUNNER_TEMP}/storage-profile-gate.out"

          set +e
          python3 packaging/layersentry/validate_live_evidence.py \
            --matrix packaging/layersentry/qualification-matrix.json \
            --release-lock packaging/layersentry/release-lock.template.json \
            --evidence-root . > "${RUNNER_TEMP}/live-evidence-gate.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Fq 'LIVE_EVIDENCE_NOT_QUALIFIED' "${RUNNER_TEMP}/live-evidence-gate.out"

      - name: Render legacy chart default
        run: |
          helm lint helm/opennebula-csi --set-string credentials.inlineAuth=ci:placeholder
          helm template legacy helm/opennebula-csi \
            --set-string credentials.inlineAuth=ci:placeholder > "${RUNNER_TEMP}/legacy.yaml"
          grep -Fq 'name: csi.opennebula.io' "${RUNNER_TEMP}/legacy.yaml"
          grep -Fq '/plugins/csi.opennebula.io/csi.sock' "${RUNNER_TEMP}/legacy.yaml"
          grep -Fq 'name: csi-resizer' "${RUNNER_TEMP}/legacy.yaml"
          ! grep -Fq 'readinessProbe:' "${RUNNER_TEMP}/legacy.yaml"

      - name: Build digest-locked LayerSentry candidate and render identity
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          digest = "a" * 64
          source_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          lock = {
              "release": {
                  "version": "0.5.15-layersentry.1",
                  "gitTag": "v0.5.15-layersentry.1",
                  "sourceCommit": source_commit,
              },
              "rke2": {
                  "version": "v1.36.4+rke2r1",
                  "commit": "7479a59cdd2c8ce0b8871699a24daa4b7c28cc64",
                  "kubeletRootDir": "/var/lib/kubelet",
              },
              "images": {
                  "driver": f"ghcr.io/adaptgurus/layersentry-csi:v0.5.15-layersentry.1@sha256:{digest}",
                  "provisioner": f"registry.k8s.io/sig-storage/csi-provisioner:v6.3.0@sha256:{digest}",
                  "attacher": f"registry.k8s.io/sig-storage/csi-attacher:v4.13.0@sha256:{digest}",
                  "nodeDriverRegistrar": f"registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:{digest}",
                  "livenessProbe": f"registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:{digest}",
              },
              "capabilities": {"expansion": False, "snapshots": False, "clones": False},
          }
          root = Path(os.environ["RUNNER_TEMP"])
          (root / "release-lock.json").write_text(json.dumps(lock))
          (root / "site-values.yaml").write_text("""storageClasses:\n  - name: layersentry-test\n    allowVolumeExpansion: false\n""")
          PY

          python3 packaging/layersentry/build_chart.py \
            --release-lock "${RUNNER_TEMP}/release-lock.json" \
            --output "${RUNNER_TEMP}/layersentry-csi"
          python3 packaging/layersentry/emit_offline_manifest.py \
            --release-lock "${RUNNER_TEMP}/release-lock.json" \
            --output "${RUNNER_TEMP}/offline-images.txt"

          helm lint "${RUNNER_TEMP}/layersentry-csi" \
            -f "${RUNNER_TEMP}/layersentry-csi/layersentry-values.json" \
            -f "${RUNNER_TEMP}/site-values.yaml" \
            --set credentials.existingSecret.name=layersentry-ci-auth
          helm template layersentry "${RUNNER_TEMP}/layersentry-csi" \
            -f "${RUNNER_TEMP}/layersentry-csi/layersentry-values.json" \
            -f "${RUNNER_TEMP}/site-values.yaml" \
            --set credentials.existingSecret.name=layersentry-ci-auth > "${RUNNER_TEMP}/layersentry.yaml"

          grep -Fq 'name: csi.layersentry.io' "${RUNNER_TEMP}/layersentry.yaml"
          grep -Fq 'provisioner: csi.layersentry.io' "${RUNNER_TEMP}/layersentry.yaml"
          grep -Fq -- '--drivername=csi.layersentry.io' "${RUNNER_TEMP}/layersentry.yaml"
          grep -Fq '/plugins/csi.layersentry.io/csi.sock' "${RUNNER_TEMP}/layersentry.yaml"
          grep -Fq 'csi-provisioner:v6.3.0@sha256:' "${RUNNER_TEMP}/layersentry.yaml"
          grep -Fq 'csi-attacher:v4.13.0@sha256:' "${RUNNER_TEMP}/layersentry.yaml"
          grep -Fq 'csi-node-driver-registrar:v2.18.0@sha256:' "${RUNNER_TEMP}/layersentry.yaml"
          grep -Fq 'livenessprobe:v2.20.0@sha256:' "${RUNNER_TEMP}/layersentry.yaml"
          test "$(grep -c 'livenessProbe:' "${RUNNER_TEMP}/layersentry.yaml")" -ge 2
          test "$(grep -c 'readinessProbe:' "${RUNNER_TEMP}/layersentry.yaml")" -ge 2
          grep -Fq 'path: /healthz' "${RUNNER_TEMP}/layersentry.yaml"
          ! grep -Fq 'name: csi-resizer' "${RUNNER_TEMP}/layersentry.yaml"
          ! grep -Fq 'csi-resizer:' "${RUNNER_TEMP}/layersentry.yaml"
          ! grep -Fq 'csi-resizer' "${RUNNER_TEMP}/offline-images.txt"
          ! grep -Fq 'csi-snapshotter' "${RUNNER_TEMP}/offline-images.txt"
          ! grep -Fq 'csi.opennebula.io' "${RUNNER_TEMP}/layersentry.yaml"

      - name: Reject unsafe LayerSentry site overrides
        shell: bash
        run: |
          set -euo pipefail
          chart="${RUNNER_TEMP}/layersentry-csi"
          profile="${RUNNER_TEMP}/layersentry-csi/layersentry-values.json"

          expect_reject() {
            local label="$1"
            local pattern="$2"
            shift 2
            local output="${RUNNER_TEMP}/reject-${label}.out"
            echo "::group::reject ${label}"
            set +e
            helm template invalid "$chart" -f "$profile" "$@" > "$output" 2>&1
            local rc=$?
            set -e
            cat "$output"
            if [[ "$rc" -eq 0 ]]; then
              echo "ERROR: unsafe override '${label}' rendered successfully; expected rejection" >&2
              echo "::endgroup::"
              return 1
            fi
            if ! grep -Fq -- "$pattern" "$output"; then
              echo "ERROR: override '${label}' failed, but not for the expected policy: ${pattern}" >&2
              echo "::endgroup::"
              return 1
            fi
            echo "PASS: ${label} rejected by expected policy"
            echo "::endgroup::"
          }

          expect_reject inline-auth 'forbids credentials.inlineAuth' \
            --set-string credentials.inlineAuth=ci:forbidden

          expect_reject multi-controller 'multi-controller topology is not qualified' \
            --set credentials.existingSecret.name=layersentry-ci-auth \
            --set controller.replicaCount=2

          expect_reject resizer 'resizer.enabled must remain false' \
            --set credentials.existingSecret.name=layersentry-ci-auth \
            --set resizer.enabled=true

          expect_reject expansion 'allowVolumeExpansion must remain false' \
            --set credentials.existingSecret.name=layersentry-ci-auth \
            --set 'storageClasses[0].name=unsafe-expand' \
            --set 'storageClasses[0].allowVolumeExpansion=true'

          expect_reject snapshotter 'snapshotter.enabled must remain false' \
            --set credentials.existingSecret.name=layersentry-ci-auth \
            --set snapshotter.enabled=true

      - name: Reject duplicate drivername source
        run: |
          set +e
          helm template invalid helm/opennebula-csi \
            --set driver.name=csi.layersentry.io \
            --set credentials.existingSecret.name=layersentry-ci-auth \
            --set resizer.enabled=false \
            --set snapshotter.enabled=false \
            --set 'driver.extraArgs[0]=--drivername=csi.other.example' > /tmp/invalid.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Fq 'driver.extraArgs must not set --drivername' /tmp/invalid.out
