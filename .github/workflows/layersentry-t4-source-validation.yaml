---
name: LayerSentry T4 Source Validation

on:
  pull_request:
    paths:
      - "cmd/opennebula-csi/**"
      - "pkg/csi/**"
      - "helm/opennebula-csi/**"
      - "packaging/layersentry/**"
      - ".github/workflows/layersentry-t4-source-validation.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Go test upstream-compatible profile
        run: go test ./...

      - name: LayerSentry tagged build and focused profile tests
        run: |
          go build -trimpath -tags layersentry ./cmd/opennebula-csi
          go test -tags layersentry ./cmd/opennebula-csi
          go test -tags layersentry ./pkg/csi/driver \
            -run '^(TestLayerSentry|TestAttachmentReconciler)'

      - name: Packaging and promotion-gate unit tests
        working-directory: packaging/layersentry
        run: |
          python3 -m unittest discover -p 'test_*.py' -v
          bash -n build_release.sh
          python3 -m py_compile \
            build_chart.py \
            emit_offline_manifest.py \
            validate_qualification.py \
            validate_storage_profile.py \
            verify_oci_attestations.py \
            live_qualification.py

      - name: Current qualification matrix must not pass production promotion
        run: |
          set +e
          python3 packaging/layersentry/validate_qualification.py \
            --matrix packaging/layersentry/qualification-matrix.json \
            --release-lock packaging/layersentry/release-lock.template.json \
            --evidence-root . \
            > "${RUNNER_TEMP}/qualification-gate.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'NOT_QUALIFIED' "${RUNNER_TEMP}/qualification-gate.out"
          grep -q 'selected_storage_profile' "${RUNNER_TEMP}/qualification-gate.out"

          set +e
          python3 packaging/layersentry/validate_storage_profile.py \
            --matrix packaging/layersentry/qualification-matrix.json \
            --release-lock packaging/layersentry/release-lock.template.json \
            --evidence-root . \
            > "${RUNNER_TEMP}/storage-profile-gate.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'STORAGE_PROFILE_NOT_QUALIFIED' "${RUNNER_TEMP}/storage-profile-gate.out"

      - name: Render legacy chart default
        run: |
          helm lint helm/opennebula-csi --set-string credentials.inlineAuth=ci:placeholder
          helm template legacy helm/opennebula-csi \
            --set-string credentials.inlineAuth=ci:placeholder > "${RUNNER_TEMP}/legacy.yaml"
          grep -q 'name: csi.opennebula.io' "${RUNNER_TEMP}/legacy.yaml"
          grep -q '/plugins/csi.opennebula.io/csi.sock' "${RUNNER_TEMP}/legacy.yaml"
          grep -q 'name: csi-resizer' "${RUNNER_TEMP}/legacy.yaml"

      - name: Build digest-locked LayerSentry candidate and render identity
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          digest = "a" * 64
          lock = {
              "rke2": {
                  "version": "v1.36.4+rke2r1",
                  "commit": "7479a59cdd2c8ce0b8871699a24daa4b7c28cc64",
                  "kubeletRootDir": "/var/lib/kubelet",
              },
              "images": {
                  "driver": f"ghcr.io/adaptgurus/layersentry-csi:v0.5.15-layersentry.1@sha256:{digest}",
                  "provisioner": f"registry.k8s.io/sig-storage/csi-provisioner:v6.3.0@sha256:{digest}",
                  "attacher": f"registry.k8s.io/sig-storage/csi-attacher:v4.13.0@sha256:{digest}",
                  "nodeDriverRegistrar": f"registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:{digest}",
                  "livenessProbe": f"registry.k8s.io/sig-storage/livenessprobe:v2.20.0@sha256:{digest}",
              },
              "capabilities": {"expansion": False, "snapshots": False, "clones": False},
          }
          root = Path(os.environ["RUNNER_TEMP"])
          (root / "release-lock.json").write_text(json.dumps(lock))
          (root / "site-values.yaml").write_text("""storageClasses:\n  - name: layersentry-test\n    allowVolumeExpansion: false\n""")
          PY
          python3 packaging/layersentry/build_chart.py \
            --release-lock "${RUNNER_TEMP}/release-lock.json" \
            --output "${RUNNER_TEMP}/layersentry-csi"
          python3 packaging/layersentry/emit_offline_manifest.py \
            --release-lock "${RUNNER_TEMP}/release-lock.json" \
            --output "${RUNNER_TEMP}/offline-images.txt"
          helm lint "${RUNNER_TEMP}/layersentry-csi" \
            -f "${RUNNER_TEMP}/layersentry-csi/layersentry-values.json" \
            -f "${RUNNER_TEMP}/site-values.yaml" \
            --set credentials.existingSecret.name=layersentry-ci-auth
          helm template layersentry "${RUNNER_TEMP}/layersentry-csi" \
            -f "${RUNNER_TEMP}/layersentry-csi/layersentry-values.json" \
            -f "${RUNNER_TEMP}/site-values.yaml" \
            --set credentials.existingSecret.name=layersentry-ci-auth > "${RUNNER_TEMP}/layersentry.yaml"
          grep -q 'name: csi.layersentry.io' "${RUNNER_TEMP}/layersentry.yaml"
          grep -q 'provisioner: csi.layersentry.io' "${RUNNER_TEMP}/layersentry.yaml"
          grep -q -- '--drivername=csi.layersentry.io' "${RUNNER_TEMP}/layersentry.yaml"
          grep -q '/plugins/csi.layersentry.io/csi.sock' "${RUNNER_TEMP}/layersentry.yaml"
          grep -q 'csi-provisioner:v6.3.0@sha256:' "${RUNNER_TEMP}/layersentry.yaml"
          grep -q 'csi-attacher:v4.13.0@sha256:' "${RUNNER_TEMP}/layersentry.yaml"
          grep -q 'csi-node-driver-registrar:v2.18.0@sha256:' "${RUNNER_TEMP}/layersentry.yaml"
          grep -q 'livenessprobe:v2.20.0@sha256:' "${RUNNER_TEMP}/layersentry.yaml"
          ! grep -q 'name: csi-resizer' "${RUNNER_TEMP}/layersentry.yaml"
          ! grep -q 'csi-resizer:' "${RUNNER_TEMP}/layersentry.yaml"
          ! grep -q 'csi-resizer' "${RUNNER_TEMP}/offline-images.txt"
          ! grep -q 'csi-snapshotter' "${RUNNER_TEMP}/offline-images.txt"
          ! grep -q 'csi.opennebula.io' "${RUNNER_TEMP}/layersentry.yaml"

      - name: Reject unsafe LayerSentry site overrides
        run: |
          chart="${RUNNER_TEMP}/layersentry-csi"
          profile="${RUNNER_TEMP}/layersentry-csi/layersentry-values.json"

          expect_reject() {
            pattern="$1"
            shift
            set +e
            helm template invalid "$chart" -f "$profile" "$@" > "${RUNNER_TEMP}/invalid.out" 2>&1
            rc=$?
            set -e
            test "$rc" -ne 0
            grep -q "$pattern" "${RUNNER_TEMP}/invalid.out"
          }

          expect_reject 'forbids credentials.inlineAuth' \
            --set-string credentials.inlineAuth=ci:forbidden

          expect_reject 'resizer.enabled must remain false' \
            --set credentials.existingSecret.name=layersentry-ci-auth \
            --set resizer.enabled=true

          expect_reject 'allowVolumeExpansion must remain false' \
            --set credentials.existingSecret.name=layersentry-ci-auth \
            --set 'storageClasses[0].name=unsafe-expand' \
            --set 'storageClasses[0].allowVolumeExpansion=true'

          expect_reject 'snapshotter.enabled must remain false' \
            --set credentials.existingSecret.name=layersentry-ci-auth \
            --set snapshotter.enabled=true

      - name: Reject duplicate drivername source
        run: |
          set +e
          helm template invalid helm/opennebula-csi \
            --set driver.name=csi.layersentry.io \
            --set credentials.existingSecret.name=layersentry-ci-auth \
            --set resizer.enabled=false \
            --set snapshotter.enabled=false \
            --set 'driver.extraArgs[0]=--drivername=csi.other.example' > /tmp/invalid.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'driver.extraArgs must not set --drivername' /tmp/invalid.out
